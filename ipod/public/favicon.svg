<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Icona dell'app: iPod stilizzato (silhouette piatta) nero su fondo bianco.
    Stesse proporzioni dell'icona di riferimento: corpo 233 × 383 (45,5 % × 75 % del quadrato),
    schermo rettangolare "ritagliato", ghiera come anello con il tasto centrale.
  -->
  <!-- Sfondo bianco (rx=115 = angoli arrotondati del 22,5 %; nella variante maskable rx=0) -->
  <rect width="512" height="512" rx="115" fill="#ffffff"/>
  <g transform="translate(139.5 64) scale(1)">
    <!-- Corpo -->
    <rect x="0" y="0" width="233" height="383" rx="26" fill="#111111"/>
    <!-- Schermo: ritaglio bianco -->
    <rect x="23.5" y="23.5" width="186" height="145" rx="5" fill="#ffffff"/>
    <!-- Ghiera: anello bianco con tasto centrale nero -->
    <circle cx="116.5" cy="280" r="70" fill="#ffffff"/>
    <circle cx="116.5" cy="280" r="28" fill="#111111"/>
  </g>
</svg>
