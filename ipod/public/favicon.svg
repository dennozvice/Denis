<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Icona dell'app: un iPod Classic argento su sfondo scuro.
    Il dispositivo è disegnato in millimetri reali (corpo 61,8 × 103,5 mm, schermo 4:3 da 2,5",
    ghiera da 40 mm, pulsante centrale da 15 mm) e poi scalato con il transform del gruppo.
  -->
  <defs>
    <!-- Sfondo: dal carbone al nero -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#303034"/>
      <stop offset="1" stop-color="#09090a"/>
    </linearGradient>
    <!-- Corpo in alluminio: leggera sfumatura verticale -->
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f2f4"/>
      <stop offset="0.5" stop-color="#d8dbdf"/>
      <stop offset="1" stop-color="#b9bdc3"/>
    </linearGradient>
    <!-- Bordo del corpo: più chiaro in alto, più scuro in basso -->
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a7abb1"/>
      <stop offset="1" stop-color="#5f646b"/>
    </linearGradient>
    <!-- Schermo spento -->
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#272b31"/>
      <stop offset="1" stop-color="#0b0d10"/>
    </linearGradient>
    <!-- Riflesso del vetro -->
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <!-- Ghiera cliccabile: grigio chiaro, appena più scura verso il bordo -->
    <radialGradient id="wheel" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#f4f5f7"/>
      <stop offset="0.75" stop-color="#e6e8eb"/>
      <stop offset="1" stop-color="#d3d6da"/>
    </radialGradient>
    <!-- Pulsante centrale: un po' più scuro della ghiera -->
    <radialGradient id="button" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#d9dce0"/>
      <stop offset="1" stop-color="#bbbfc5"/>
    </radialGradient>
    <!-- Ombra morbida sotto il dispositivo -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>

  <rect id="sfondo" width="512" height="512" rx="115" fill="url(#bg)"/>

  <g id="dispositivo" transform="translate(124.7 36.1) scale(4.25)">
    <rect x="0.4" y="1.6" width="61" height="103" rx="6" fill="#000" opacity="0.55" filter="url(#shadow)"/>
    <rect x="0" y="0" width="61.8" height="103.5" rx="6" fill="url(#body)" stroke="url(#edge)" stroke-width="0.5"/>
    <rect x="0.55" y="0.55" width="60.7" height="102.4" rx="5.6" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="0.3"/>

    <rect x="5.5" y="8" width="50.8" height="38.1" rx="1.6" fill="url(#screen)" stroke="#3a3e45" stroke-width="0.4"/>
    <path d="M6 8.5 H56 V18.5 Q31 26 6 31 Z" fill="url(#gloss)"/>

    <circle cx="30.9" cy="75.5" r="20" fill="url(#wheel)" stroke="#b1b5bb" stroke-width="0.45"/>
    <circle cx="30.9" cy="75.5" r="7.5" fill="url(#button)" stroke="#a1a5ab" stroke-width="0.4"/>

    <!-- Simboli della ghiera, molto discreti -->
    <g fill="#9ea2a8">
      <text x="30.9" y="62.2" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="2.6" font-weight="700" letter-spacing="0.15">MENU</text>
      <path d="M28.6 88.6 L32.6 90.6 L28.6 92.6 Z M33.3 88.6 H34.2 V92.6 H33.3 Z M34.9 88.6 H35.8 V92.6 H34.9 Z" transform="translate(-1.3 0)"/>
      <path d="M13.2 73.9 H14.1 V77.1 H13.2 Z M14.6 75.5 L17.6 73.9 V77.1 Z M17.9 75.5 L20.9 73.9 V77.1 Z"/>
      <path d="M48.6 73.9 H47.7 V77.1 H48.6 Z M47.2 75.5 L44.2 73.9 V77.1 Z M43.9 75.5 L40.9 73.9 V77.1 Z"/>
    </g>
  </g>
</svg>
