<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{NAME}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@200;300;400&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/hud.css">
</head>
<body data-state="offline">
  <div class="bg"></div>

  <header class="top">
    <div class="brand">
      <div class="brand-name" id="brand">{{NAME}}</div>
      <div class="brand-sub" id="tagline">{{TAGLINE}}</div>
    </div>
    <div class="status" id="status"><span class="dot"></span><span id="state-label">Offline</span></div>
    <div class="clock">
      <div class="time" id="clock">--:--</div>
      <div class="date" id="date"></div>
    </div>
  </header>

  <main class="stage">
    <aside class="card left">
      <div class="card-title">Sistema</div>
      <div class="row"><span>Collegamento</span><span id="link" class="val muted">in attesa</span></div>
      <div class="row"><span>Modalità</span><span id="mode" class="val">vocale</span></div>
      <div class="row"><span>Microfono</span><div class="meter" id="meter"><i></i></div></div>
      <div class="row"><span>Ultima azione</span><span id="last-tool" class="val">—</span></div>
      <div class="hint">Di' «<span class="accent" id="hint-name">{{NAME}}</span>» per parlare.<br>Spazio attiva, Esc zittisce.</div>
    </aside>

    <section class="center">
      <canvas id="orb"></canvas>
      <div class="caption" id="caption"></div>
      <div class="wave" id="wave"></div>
    </section>

    <aside class="card right">
      <div class="card-title">Attività</div>
      <ul class="tools" id="tools"></ul>
      <ul class="notices" id="notices"></ul>
    </aside>
  </main>

  <footer class="bottom">
    <div class="transcript" id="transcript"></div>
    <form class="composer" id="form" autocomplete="off">
      <button type="button" class="round" id="trigger" title="Attiva (Spazio)"><span class="mic"></span></button>
      <input id="input" type="text" placeholder="Scrivi oppure parla…" spellcheck="false">
      <button type="submit" class="round" title="Invia"><span class="arrow"></span></button>
      <button type="button" class="round ghost" id="stop" title="Interrompi la voce (Esc)"><span class="square"></span></button>
    </form>
  </footer>

  <script src="/static/hud.js"></script>
</body>
</html>
