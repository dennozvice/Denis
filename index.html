<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Dashboard personale del consulente: attività di oggi, agenda, fondi e mercati, clienti e scadenze." />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Advisor Desk</title>
    <script>
      // Applica il tema prima del primo rendering per evitare il "lampo" bianco in modalità scura.
      ;(function () {
        var theme = 'sistema'
        try {
          var raw = localStorage.getItem('advisor-desk:data')
          if (raw) theme = (JSON.parse(raw).settings || {}).theme || theme
        } catch (e) {}
        var dark = theme === 'scuro' || (theme === 'sistema' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Per usare la dashboard è necessario abilitare JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
