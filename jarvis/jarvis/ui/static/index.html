<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{NAME}} HUD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/hud.css">
</head>
<body>
  <div class="scanlines"></div>
  <div class="vignette"></div>

  <header class="top">
    <div class="brand">
      <div class="brand-name" id="brand">{{NAME}}</div>
      <div class="brand-sub">Just A Rather Very Intelligent System</div>
    </div>
    <div class="state-badge" id="state-badge"><span class="dot"></span><span id="state-label">OFFLINE</span></div>
    <div class="clock">
      <div class="time" id="clock">--:--</div>
      <div class="date" id="date">—</div>
    </div>
  </header>

  <main class="grid">
    <aside class="panel left">
      <div class="panel-title">SISTEMI</div>
      <div class="row"><span>Collegamento</span><span id="link" class="val warn">in attesa</span></div>
      <div class="row"><span>Modalità</span><span id="mode" class="val">—</span></div>
      <div class="row"><span>Microfono</span><div class="bars" id="bars"></div></div>
      <div class="row"><span>Ultimo strumento</span><span id="last-tool" class="val">—</span></div>
      <div class="panel-title small">STATO</div>
      <div class="detail" id="detail">—</div>
      <div class="hint">Di' «<span class="accent">{{NAME}}</span>» per parlare<br>Spazio: attiva · Esc: zittisci</div>
    </aside>

    <section class="center">
      <canvas id="reactor"></canvas>
      <div class="center-caption" id="caption"></div>
    </section>

    <aside class="panel right">
      <div class="panel-title">ATTIVITÀ</div>
      <ul class="tools" id="tools"></ul>
      <div class="panel-title small">NOTIFICHE</div>
      <ul class="notices" id="notices"></ul>
    </aside>
  </main>

  <footer class="bottom">
    <div class="transcript" id="transcript"></div>
    <form class="input-row" id="form" autocomplete="off">
      <button type="button" class="icon" id="trigger" title="Attiva (Spazio)">◉</button>
      <input id="input" type="text" placeholder="Scrivi un comando oppure parla…" spellcheck="false">
      <button type="submit" class="icon" title="Invia">➤</button>
      <button type="button" class="icon" id="stop" title="Interrompi la voce (Esc)">■</button>
    </form>
  </footer>

  <script src="/static/hud.js"></script>
</body>
</html>
