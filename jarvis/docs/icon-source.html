<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <clipPath id="squircle"><path d="M 512 0 C 160 0 0 160 0 512 C 0 864 160 1024 512 1024 C 864 1024 1024 864 1024 512 C 1024 160 864 0 512 0 Z"/></clipPath>
    <clipPath id="orbClip"><circle cx="512" cy="512" r="200"/></clipPath>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%"><stop offset="0" stop-color="#121226"/><stop offset="0.6" stop-color="#07070f"/><stop offset="1" stop-color="#000000"/></radialGradient>
    <radialGradient id="orbBase" cx="45%" cy="40%" r="62%"><stop offset="0" stop-color="#bfe9ff"/><stop offset="0.4" stop-color="#3f7dff"/><stop offset="1" stop-color="#2a1a7a"/></radialGradient>
    <radialGradient id="c-purple" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#9b4dff"/><stop offset="1" stop-color="#9b4dff" stop-opacity="0"/></radialGradient>
    <radialGradient id="c-pink" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ff3d9a"/><stop offset="1" stop-color="#ff3d9a" stop-opacity="0"/></radialGradient>
    <radialGradient id="c-orange" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ff9d3b"/><stop offset="1" stop-color="#ff9d3b" stop-opacity="0"/></radialGradient>
    <radialGradient id="c-cyan" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#5df3ff"/><stop offset="1" stop-color="#5df3ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="c-white" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
    <linearGradient id="ringA" gradientUnits="userSpaceOnUse" x1="132" y1="132" x2="892" y2="892"><stop offset="0" stop-color="#5df3ff"/><stop offset="0.5" stop-color="#9b4dff"/><stop offset="1" stop-color="#ff3d9a"/></linearGradient>
    <linearGradient id="ringB" gradientUnits="userSpaceOnUse" x1="892" y1="132" x2="132" y2="892"><stop offset="0" stop-color="#ff9d3b"/><stop offset="0.5" stop-color="#ff3d9a"/><stop offset="1" stop-color="#2f6cff"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/><stop offset="0.6" stop-color="#ffffff" stop-opacity="0.05"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <filter id="b10" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="b30" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="b60" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="b4"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <g clip-path="url(#squircle)">
    <rect width="1024" height="1024" fill="url(#bg)"/>

    <!-- alone colorato diffuso dietro la sfera -->
    <g filter="url(#b60)" opacity="0.45">
      <circle cx="430" cy="440" r="230" fill="#2f6cff"/>
      <circle cx="600" cy="460" r="200" fill="#9b4dff"/>
      <circle cx="570" cy="610" r="170" fill="#ff3d9a"/>
      <circle cx="440" cy="600" r="130" fill="#ff9d3b"/>
    </g>

    <!-- anelli sottili come nella prima versione -->
    <g fill="none" stroke-linecap="round">
      <circle cx="512" cy="512" r="392" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>
      <circle cx="512" cy="512" r="340" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2" stroke-dasharray="3 22"/>
      <g stroke-width="7" opacity="0.95" filter="url(#b4)">
        <path d="M 512 146 A 366 366 0 0 1 829 329" stroke="url(#ringA)"/>
        <path d="M 512 878 A 366 366 0 0 1 195 695" stroke="url(#ringB)"/>
      </g>
      <g stroke-width="5" opacity="0.9">
        <path d="M 512 146 A 366 366 0 0 1 829 329" stroke="url(#ringA)"/>
        <path d="M 512 878 A 366 366 0 0 1 195 695" stroke="url(#ringB)"/>
      </g>
      <g stroke-width="3" opacity="0.5">
        <path d="M 236 352 A 318 318 0 0 1 300 290" stroke="#5df3ff"/>
        <path d="M 788 672 A 318 318 0 0 1 724 734" stroke="#ff3d9a"/>
      </g>
    </g>

    <!-- sfera -->
    <g>
      <circle cx="512" cy="512" r="215" fill="#2f6cff" opacity="0.6" filter="url(#b30)"/>
      <circle cx="512" cy="512" r="200" fill="url(#orbBase)"/>
      <g clip-path="url(#orbClip)">
        <circle cx="610" cy="420" r="190" fill="url(#c-purple)" filter="url(#b10)"/>
        <circle cx="650" cy="600" r="190" fill="url(#c-pink)" filter="url(#b10)"/>
        <circle cx="640" cy="600" r="120" fill="url(#c-pink)" filter="url(#b10)"/>
        <circle cx="460" cy="670" r="160" fill="url(#c-orange)" filter="url(#b10)"/>
        <circle cx="390" cy="430" r="170" fill="url(#c-cyan)" filter="url(#b10)"/>
        <circle cx="400" cy="440" r="100" fill="url(#c-cyan)" filter="url(#b10)"/>
        <circle cx="560" cy="380" r="130" fill="url(#c-white)" opacity="0.8" filter="url(#b30)"/>
        <!-- bordo interno più scuro per dare volume -->
        <circle cx="512" cy="512" r="200" fill="none" stroke="#0a0530" stroke-opacity="0.4" stroke-width="30" filter="url(#b30)"/>
      </g>
      <!-- riflesso di vetro -->
      <ellipse cx="512" cy="392" rx="135" ry="72" fill="url(#glass)"/>
      <circle cx="512" cy="512" r="200" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2.5"/>
    </g>
  </g>
</svg></body></html>
